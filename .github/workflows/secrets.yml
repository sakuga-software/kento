name: Secrets

# gitleaks on the history of the commit under test: a key, a token or a password in a file of any
# commit fails the check. The rules are the defaults of gitleaks, less the fake values of
# .gitleaks.toml. The binary comes from the release of gitleaks and is checked against its SHA-256;
# Dependabot does not update it, so change VERSION and the two sums together.
#
# Private names: the tracked files of main must hold no name of the list in the secret
# PRIVATE_NAMES (private repositories, internal hosts, people). The list is not in the repository.
# The secret is in the environment names-check, which only main can use: the code of a pull request
# never runs with it. So the check runs on a push to main and on a manual run from main, and fails
# when the secret is missing. A pull request runs only the test of the script.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: secrets-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  gitleaks:
    name: Secrets (gitleaks)
    # Our self-hosted runners while the repository is private (no billed minutes), the runners of
    # GitHub once it is public: a pull request from a fork must not run on our machines (README, "CI").
    runs-on: ${{ github.event.repository.private && fromJSON('["self-hosted", "sakuga-light"]') || 'ubuntu-latest' }}
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks
        env:
          VERSION: 8.30.1
          SHA256_LINUX_X64: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          SHA256_LINUX_ARM64: e4a487ee7ccd7d3a7f7ec08657610aa3606637dab924210b3aee62570fb4b080
        run: |
          case "$RUNNER_OS-$RUNNER_ARCH" in
            Linux-X64) asset=linux_x64; sum=$SHA256_LINUX_X64 ;;
            Linux-ARM64) asset=linux_arm64; sum=$SHA256_LINUX_ARM64 ;;
            *) echo "::error::No gitleaks build for $RUNNER_OS-$RUNNER_ARCH."; exit 1 ;;
          esac
          file="gitleaks_${VERSION}_${asset}.tar.gz"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$file" "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/$file"
          echo "$sum  $RUNNER_TEMP/$file" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$file" -C "$RUNNER_TEMP" gitleaks
      # `--log-opts=HEAD`: the commits that lead to the commit under test only, not the branches of
      # other pull requests.
      - name: Scan the history
        run: '"$RUNNER_TEMP/gitleaks" git --redact --no-banner --log-opts=HEAD --config .gitleaks.toml .'

  names-test:
    name: Secrets (test of the private names check)
    runs-on: ${{ github.event.repository.private && fromJSON('["self-hosted", "sakuga-light"]') || 'ubuntu-latest' }}
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test the check
        run: .github/scripts/check-names.test.sh
      - name: Say where the check runs
        if: github.event_name == 'pull_request'
        run: echo "::notice title=Private names::A pull request runs only the test of the script. The check against the list runs on each push to main."

  names:
    name: Secrets (private names)
    needs: names-test
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ${{ github.event.repository.private && fromJSON('["self-hosted", "sakuga-light"]') || 'ubuntu-latest' }}
    timeout-minutes: 5
    # Only main can use this environment (README.md, section CI): its secret never reaches the code
    # of a pull request.
    environment: names-check
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The log shows the path and the line of a match, never the name. Each name is also masked.
      - name: Check the private names
        env:
          PRIVATE_NAMES: ${{ secrets.PRIVATE_NAMES }}
        run: |
          if [ -z "$PRIVATE_NAMES" ]; then
            echo "::error title=Private names::The secret PRIVATE_NAMES of the environment names-check is missing or empty (README.md, section CI)."
            exit 1
          fi
          list="$RUNNER_TEMP/private-names.txt"
          printf '%s\n' "$PRIVATE_NAMES" | tr -d '\r' > "$list"
          while IFS= read -r name; do
            name="${name#"${name%%[![:space:]]*}"}"; name="${name%"${name##*[![:space:]]}"}"
            case "$name" in ''|'#'*) ;; *) echo "::add-mask::$name" ;; esac
          done < "$list"
          status=0
          .github/scripts/check-names.sh --quiet "$list" || status=$?
          rm -f "$list"
          exit "$status"

name: Web

# The checks of apps/web (Kentō web service): lint, types, unit tests, tests against Postgres, the
# screens in a browser, and the build of its Docker image.
#
# No path filter: a check that always runs can be a required check. `Web passed` is the one check to
# require in a ruleset; it fails when a job fails, is cancelled or is skipped.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: web-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

# Each job runs on our self-hosted runners while the repository is private, and on the runners of
# GitHub once it is public: a pull request from a fork must not run on our machines (README, "CI").
# On our runners, `sakuga-light` has no Docker: lint, types and unit tests run there. The tests
# against Postgres and the image build need Docker, so they run on `sakuga-linux` with the `docker`
# label. The images of the job containers and of the services are pinned by digest after their tag:
# Dependabot does not update them, so change the tag and the digest together.
jobs:
  check:
    name: Lint, types and unit tests
    runs-on: ${{ github.event.repository.private && fromJSON('["self-hosted", "sakuga-light"]') || 'ubuntu-latest' }}
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-pnpm
        with:
          filter: '@kento-review/web'
      - name: Lint
        run: pnpm lint
      - name: Type check
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm test
      # The schema and the migrations must agree: a change of app/db/schema.ts without its migration
      # makes drizzle-kit write a new file.
      - name: Migrations match the schema
        run: |
          pnpm db:generate --name ci_check
          if [ -n "$(git status --porcelain -- drizzle)" ]; then
            git status --porcelain -- drizzle
            echo "::error::app/db/schema.ts changed without its migration. Run pnpm -F @kento-review/web db:generate and commit drizzle/."
            exit 1
          fi

  test-db:
    name: Tests against Postgres
    runs-on: ${{ github.event.repository.private && fromJSON('["self-hosted", "sakuga-linux", "docker"]') || 'ubuntu-latest' }}
    timeout-minutes: 15
    permissions:
      contents: read
    # The job runs in a container on the network of its service, and reaches Postgres by its name.
    # No port is published on the host: a published port is a random host port, and under rootless
    # Docker it can already be taken (run 40741576267: « bind: address already in use »).
    container: node:26-bookworm@sha256:b7087bc4d973034b30854b378ba107f9fab622b47514cb7e2592e41b8bab8d49
    services:
      postgres:
        image: postgres:18.3@sha256:7e32e9833a6fb1c92c32552794cb6ed569d51b445a54907d35fc112ef39684db
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        options: >-
          --tmpfs /var/lib/postgresql
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-pnpm
        with:
          filter: '@kento-review/web'
      - name: Tests against Postgres
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@postgres:5432/postgres
        run: pnpm test:db

  # The screens in Chromium against the real server and Postgres, with axe on each screen, and the
  # content security policy of every screen under WebKit too (KNT-171). The job container reaches
  # Postgres by its name, as in test-db.
  e2e:
    name: Screens in a browser (Playwright, axe)
    runs-on: ${{ github.event.repository.private && fromJSON('["self-hosted", "sakuga-linux", "docker"]') || 'ubuntu-latest' }}
    timeout-minutes: 15
    permissions:
      contents: read
    container: node:26-bookworm@sha256:b7087bc4d973034b30854b378ba107f9fab622b47514cb7e2592e41b8bab8d49
    services:
      postgres:
        image: postgres:18.3@sha256:7e32e9833a6fb1c92c32552794cb6ed569d51b445a54907d35fc112ef39684db
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        options: >-
          --tmpfs /var/lib/postgresql
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-pnpm
        with:
          filter: '@kento-review/web'
      # Chromium and WebKit of the Playwright version in package.json, and the system libraries they
      # need. WebKit runs e2e/csp.spec.ts only (KNT-171): the content security policy under the engine
      # of Safari.
      - name: Install Chromium and WebKit
        run: pnpm exec playwright install --with-deps chromium webkit
      - name: Screens in a browser
        env:
          CI: 'true'
          E2E_DATABASE_URL: postgres://postgres:postgres@postgres:5432/postgres
        run: pnpm e2e
      - name: Keep the report of a failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7

  image:
    name: Docker image
    runs-on: ${{ github.event.repository.private && fromJSON('["self-hosted", "sakuga-linux", "docker"]') || 'ubuntu-latest' }}
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the image
        env:
          APP_COMMIT: ${{ github.sha }}
          IMAGE: kento-web:ci-${{ github.run_id }}
          # The pull requests use a pnpm cache of the Docker daemon apart from the one of main
          # (apps/*/Dockerfile). One cache for all of them: it does not grow with each pull request.
          PNPM_CACHE_ID: ${{ github.event_name == 'pull_request' && 'pnpm-store-pr' || 'pnpm-store' }}
        run: docker build -f apps/web/Dockerfile --build-arg APP_COMMIT="$APP_COMMIT" --build-arg PNPM_CACHE_ID="$PNPM_CACHE_ID" -t "$IMAGE" .
      - name: Remove the image
        if: always()
        env:
          IMAGE: kento-web:ci-${{ github.run_id }}
        run: docker image rm "$IMAGE" || true

  web-passed:
    name: Web passed
    if: always()
    needs: [check, test-db, e2e, image]
    runs-on: ${{ github.event.repository.private && fromJSON('["self-hosted", "sakuga-light"]') || 'ubuntu-latest' }}
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Every job must succeed
        env:
          FAILED: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}
        run: |
          if [ "$FAILED" = "true" ]; then
            echo "::error::A job of the Web workflow failed, was cancelled or was skipped."
            exit 1
          fi

name: Web

# The checks of apps/web (Kentō web service): lint, types, unit tests, tests against Postgres, and
# the build of its Docker image.
#
# No path filter: a check that always runs can be a required check. `Web passed` is the one check to
# require in a ruleset; it fails when a job fails, is cancelled or is skipped.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: web-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# `sakuga-light` (linux-runner arm64, runners-host x64) has no Docker: lint, types and unit tests run
# there. The tests against Postgres and the image build need Docker, so they run on `sakuga-linux`
# with the `docker` label.
jobs:
  check:
    name: Lint, types and unit tests
    runs-on: [self-hosted, sakuga-light]
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-web
      - name: Lint
        run: pnpm lint
      - name: Type check
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm test
      # The schema and the migrations must agree: a change of app/db/schema.ts without its migration
      # makes drizzle-kit write a new file.
      - name: Migrations match the schema
        run: |
          pnpm db:generate --name ci_check
          if [ -n "$(git status --porcelain -- drizzle)" ]; then
            git status --porcelain -- drizzle
            echo "::error::app/db/schema.ts changed without its migration. Run pnpm -F @sakuga-review/web db:generate and commit drizzle/."
            exit 1
          fi

  test-db:
    name: Tests against Postgres
    runs-on: [self-hosted, sakuga-linux, docker]
    timeout-minutes: 15
    # The job runs in a container on the network of its service, and reaches Postgres by its name.
    # No port is published on the host: a published port is a random host port, and under rootless
    # Docker it can already be taken (run 40741576267: « bind: address already in use »).
    container: node:24-bookworm
    services:
      postgres:
        image: postgres:18.3
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        options: >-
          --tmpfs /var/lib/postgresql
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-web
      - name: Tests against Postgres
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@postgres:5432/postgres
        run: pnpm test:db

  image:
    name: Docker image
    runs-on: [self-hosted, sakuga-linux, docker]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker build -f apps/web/Dockerfile --build-arg APP_COMMIT=${{ github.sha }} -t kento-web:ci-${{ github.run_id }} .
      - name: Remove the image
        if: always()
        run: docker image rm kento-web:ci-${{ github.run_id }} || true

  web-passed:
    name: Web passed
    if: always()
    needs: [check, test-db, image]
    runs-on: [self-hosted, sakuga-light]
    timeout-minutes: 5
    steps:
      - name: Every job must succeed
        env:
          FAILED: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}
        run: |
          if [ "$FAILED" = "true" ]; then
            echo "::error::A job of the Web workflow failed, was cancelled or was skipped."
            exit 1
          fi

# The review of a pull request by Sakuga Review: one call to a model through OpenRouter reads the
# diff, then review/sakuga-review.ts posts the findings as the GitHub App « Sakuga Review ».
# A repository calls it from its own workflow: see README.md.
name: Sakuga Review

on:
  workflow_call:
    inputs:
      # The bots that act for a person: their pull requests get a review and their comments give
      # commands, as a person's do. Every other bot is skipped, this App first: its own comments must
      # not start a run. A comma-separated list of logins.
      trusted_bots:
        type: string
        required: false
        default: sakuga-agent[bot]
    # The two secrets the review needs, and no other: a caller passes them by name.
    secrets:
      PR_AGENT_APP_PRIVATE_KEY:
        required: true
      OPENROUTER_API_KEY:
        required: true

# The workflow token needs no permission: the script posts with a token of the App.
permissions: {}

jobs:
  sakuga_review:
    name: Sakuga Review
    # The review of a push: one call to a model through OpenRouter, then review/sakuga-review.ts
    # posts the findings. Drafts are skipped, and so are the pull requests and the pushes of a bot
    # that is not in `trusted_bots`.
    if: >-
      github.event_name == 'pull_request' &&
      (github.event.sender.type != 'Bot' || contains(format(',{0},', inputs.trusted_bots), format(',{0},', github.event.sender.login))) &&
      !github.event.pull_request.draft &&
      (github.event.pull_request.user.type != 'Bot' || contains(format(',{0},', inputs.trusted_bots), format(',{0},', github.event.pull_request.user.login)))
    runs-on: [self-hosted, sakuga-linux]
    timeout-minutes: 15
    # A new push replaces the review of the previous one.
    concurrency:
      group: sakuga-review-${{ github.repository }}-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - name: Sakuga Review token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: Iv23liesB1xzywavcnv2
          private-key: ${{ secrets.PR_AGENT_APP_PRIVATE_KEY }}
          repositories: |
            ${{ github.event.repository.name }}
            sakuga-review
          permission-contents: read
          permission-pull-requests: write
          # The score label of the pull request.
          permission-issues: write
      # The whole history: the script diffs from the merge base, and a thread closes only when its
      # file changed since the commit that the thread names.
      - name: Check out the pull request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          path: repo
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false
      # The script and its prompt, at the commit of this workflow: the commit that the caller pins.
      - name: Check out the review script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: settings
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false
      # Node runs the TypeScript of the script as is: no package and no build.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26'
      # The script reads the code and never runs it.
      - name: Review
        run: >-
          node settings/review/sakuga-review.ts --repo-dir repo --repository "$REPOSITORY"
          --pr "$PR_NUMBER" --base "$BASE_SHA" --head "$HEAD_SHA"
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}

  # A command in a comment of the pull request: `@sakuga-review review [lite|balanced|heavy]` or
  # `@sakuga-review resolve [level]`. The script checks that the author can write to the repository.
  sakuga_command:
    name: Sakuga Review command
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request &&
      github.event.issue.state == 'open' &&
      (github.event.sender.type != 'Bot' || contains(format(',{0},', inputs.trusted_bots), format(',{0},', github.event.sender.login))) &&
      startsWith(github.event.comment.body, '@sakuga-review')
    runs-on: [self-hosted, sakuga-linux]
    # A heavy review can think for 12 minutes.
    timeout-minutes: 20
    # One run at a time on a pull request. A push still cancels a command in progress: the review of
    # the push replaces it.
    concurrency:
      group: sakuga-review-${{ github.repository }}-${{ github.event.issue.number }}
      cancel-in-progress: false
    steps:
      - name: Sakuga Review token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: Iv23liesB1xzywavcnv2
          private-key: ${{ secrets.PR_AGENT_APP_PRIVATE_KEY }}
          repositories: |
            ${{ github.event.repository.name }}
            sakuga-review
          permission-contents: read
          permission-pull-requests: write
          permission-issues: write
      # GitHub resolves a review thread only for a token that can write the contents. The App gets
      # that permission only after an owner of the organization accepts it: until then this step
      # fails, and resolve replies to the threads that a person can resolve.
      - name: Sakuga Review token to resolve threads
        id: resolve-token
        if: contains(github.event.comment.body, 'resolve')
        continue-on-error: true
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: Iv23liesB1xzywavcnv2
          private-key: ${{ secrets.PR_AGENT_APP_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26'
      # A comment event carries no commit: read the head and the base of the pull request.
      - name: Read the pull request
        id: pr
        run: |
          node --input-type=module -e '
            import { appendFileSync } from "node:fs";
            const response = await fetch(`https://api.github.com/repos/${process.env.REPOSITORY}/pulls/${process.env.PR_NUMBER}`, {
              headers: { Authorization: `Bearer ${process.env.GITHUB_TOKEN}`, Accept: "application/vnd.github+json" },
            });
            if (!response.ok) throw new Error(`GitHub answered ${response.status}`);
            const pr = await response.json();
            appendFileSync(process.env.GITHUB_OUTPUT, `head=${pr.head.sha}\nbase=${pr.base.sha}\n`);
          '
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.issue.number }}
      - name: Check out the pull request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.pr.outputs.head }}
          fetch-depth: 0
          path: repo
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false
      - name: Check out the review script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: settings
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false
      # The comment goes through the environment, never into the command line of the shell.
      - name: Command
        run: >-
          node settings/review/sakuga-review.ts --repo-dir repo --repository "$REPOSITORY"
          --pr "$PR_NUMBER" --base "$BASE_SHA" --head "$HEAD_SHA"
          --command "$COMMAND" --comment-id "$COMMENT_ID" --commenter "$COMMENTER"
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          GITHUB_TOKEN_RESOLVE: ${{ steps.resolve-token.outputs.token }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.issue.number }}
          BASE_SHA: ${{ steps.pr.outputs.base }}
          HEAD_SHA: ${{ steps.pr.outputs.head }}
          COMMAND: ${{ github.event.comment.body }}
          COMMENT_ID: ${{ github.event.comment.id }}
          COMMENTER: ${{ github.event.comment.user.login }}
          TRUSTED_BOTS: ${{ inputs.trusted_bots }}

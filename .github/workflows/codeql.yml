name: CodeQL

# CodeQL on the TypeScript and on the workflows. It needs code scanning, which a private repository
# has only with paid GitHub Code Security: until the repository is public, the job is skipped and
# costs nothing. Once it is public, it runs on the runners of GitHub, never on our own. While the
# job is skipped, its check is named `CodeQL (${{ matrix.language }})`: never make that name a
# required check. This workflow is the advanced setup of code scanning: keep the default setup off,
# or GitHub refuses the results of this workflow.

on:
  pull_request:
  push:
    branches: [main]
  # To check the workflow at once, after the repository becomes public.
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  analyze:
    name: CodeQL (${{ matrix.language }})
    if: ${{ github.event.repository.private == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      # To upload the results to code scanning.
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [actions, javascript-typescript]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:${{ matrix.language }}

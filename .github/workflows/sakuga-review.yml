# Automatic review of pull requests by Sakuga Review (GLM-5.3 through OpenRouter), and its commands
# in a comment: `@sakuga-review review [lite|balanced|heavy]`, `@sakuga-review resolve`.
# See https://github.com/sakuga-software/sakuga-review.
#
# This repository reviews its own pull requests with a released version, pinned below, and not with
# the code of the pull request: a change of the review does not review itself.
name: Sakuga Review

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
  issue_comment:
    types: [created]

# The review posts with a token of the GitHub App, which the shared workflow asks for. The token of
# this workflow is not used, so it gets no permission.
permissions: {}

jobs:
  review:
    # Pinned to a commit of sakuga-review: the secrets below go to this exact code. To take a new
    # version, replace the SHA and the tag in the comment (see the README of sakuga-review).
    uses: sakuga-software/sakuga-review/.github/workflows/review.yml@ea75cd4ceb471dab6b3cede1994ab13dcb07f30b # v4.1
    secrets:
      PR_AGENT_APP_PRIVATE_KEY: ${{ secrets.PR_AGENT_APP_PRIVATE_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

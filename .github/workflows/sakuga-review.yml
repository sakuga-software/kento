# The commands of Sakuga Review in a comment of a pull request: `@sakuga-review review [lite|balanced|heavy]`
# and `@sakuga-review resolve`. See https://github.com/sakuga-software/sakuga-review.
#
# The automatic review of each push no longer runs here: Kentō (apps/web) publishes it, with a runner
# and the GitHub App, and no GitHub Actions (REV-5). The commands stay on the workflow until Kentō
# takes them (the ticket of the `@kento` commands).
#
# This repository runs the commands with the code of `main`, not with the code of the pull request:
# a change of the review does not review itself, and a merged change runs here before `stable` moves
# to it (see the README).
name: Sakuga Review

on:
  issue_comment:
    types: [created]

# The review posts with a token of the GitHub App, which the shared workflow asks for. The token of
# this workflow is not used, so it gets no permission.
permissions: {}

jobs:
  review:
    uses: sakuga-software/sakuga-review/.github/workflows/review.yml@main
    secrets:
      PR_AGENT_APP_PRIVATE_KEY: ${{ secrets.PR_AGENT_APP_PRIVATE_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

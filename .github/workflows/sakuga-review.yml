# Automatic review of pull requests by Sakuga Review (Claude Haiku 5.5 through OpenRouter), and its commands
# in a comment: `@sakuga-review review [lite|balanced|heavy]`, `@sakuga-review resolve`.
# See https://github.com/sakuga-software/sakuga-review.
#
# This repository reviews its own pull requests with the code of `main`, not with the code of the
# pull request: a change of the review does not review itself, and a merged change runs here before
# `stable` moves to it (see the README).
name: Sakuga Review

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
  issue_comment:
    types: [created]

# The review posts with a token of the GitHub App, which the shared workflow asks for. The token of
# this workflow is not used, so it gets no permission.
permissions: {}

jobs:
  review:
    uses: sakuga-software/sakuga-review/.github/workflows/review.yml@main
    secrets:
      PR_AGENT_APP_PRIVATE_KEY: ${{ secrets.PR_AGENT_APP_PRIVATE_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

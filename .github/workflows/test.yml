# The checks of the engine (packages/engine), of the runner and of the bench: the types, and the
# tests of the engine. Node runs the TypeScript as is; the install brings only tsc. Nothing here
# calls a model or GitHub.
name: Test

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: test-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  test:
    name: Test
    # Our self-hosted runners while the repository is private, the runners of GitHub once it is
    # public: a pull request from a fork must not run on our machines (README, "CI").
    runs-on: ${{ github.event.repository.private && fromJSON('["self-hosted", "sakuga-linux"]') || 'ubuntu-latest' }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-pnpm
      - run: pnpm typecheck
      - run: pnpm test

name: Setup apps/web
description: Node.js, pnpm, and the dependencies of apps/web. Check out the code first.

runs:
  using: composite
  steps:
    # A self-hosted runner keeps its work directory between jobs: remove what an earlier job left,
    # but keep node_modules, which `pnpm install` brings up to date.
    - name: Clean the work directory
      if: runner.environment == 'self-hosted'
      shell: bash
      run: git clean -ffdx -e node_modules

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24'

    # The version comes from `packageManager` in the root package.json.
    - name: Setup pnpm
      uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile --filter @sakuga-review/web
